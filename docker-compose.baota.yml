# =============================================================================
# NextChat Docker Compose 配置 - 宝塔面板专用版
# =============================================================================
# 使用方法：
# 1. 在宝塔面板 -> Docker -> Compose 项目 中导入此文件
# 2. 环境变量通过 .env.baota 文件配置
# 3. 通过 chat.dyxcloud.com 域名访问（Nginx 反代到本机 3000 端口，应用直连远程 PostgreSQL）
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # NextChat 主服务
  # ---------------------------------------------------------------------------
  nextchat:
    platform: ${NEXTCHAT_PLATFORM:-linux/amd64}
    image: ${NEXTCHAT_IMAGE:-nextchat-baota:latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        - APK_MIRROR=${APK_MIRROR:-${ALPINE_MIRROR:-https://mirrors.aliyun.com/alpine}}
        - NPM_REGISTRY=${NPM_REGISTRY:-https://registry.npmmirror.com}
        - ENABLE_GOOGLE_FONTS=${ENABLE_GOOGLE_FONTS:-false}
        - GITHUB_BASE_URL=${GITHUB_BASE_URL:-https://github.com}
        - GITHUB_API_BASE_URL=${GITHUB_API_BASE_URL:-https://api.github.com}
        - GITHUB_RAW_BASE_URL=${GITHUB_RAW_BASE_URL:-https://raw.githubusercontent.com}
        - ENABLE_SHAREGPT=${ENABLE_SHAREGPT:-false}
        - NEXT_PUBLIC_DEFAULT_SYNC_USER_ID=${NEXT_PUBLIC_DEFAULT_SYNC_USER_ID:-user:admin}
        - BUILD_COMMIT_DATE=${BUILD_COMMIT_DATE:-unknown}
        - BUILD_COMMIT_HASH=${BUILD_COMMIT_HASH:-unknown}

    container_name: nextchat
    restart: unless-stopped

    ports:
      # 仅允许宿主机 Nginx 访问，避免 3000 端口直接暴露到公网
      - "127.0.0.1:${PORT:-3000}:3000"

    environment:
      # 运行环境
      - NODE_ENV=production
      - PORT=${PORT:-3000}
      - HOSTNAME=0.0.0.0
      - APP_SECRET=${APP_SECRET:-}

      # 访问控制
      - CODE=${CODE}
      - HIDE_USER_API_KEY=${HIDE_USER_API_KEY:-false}
      - DISABLE_GPT4=${DISABLE_GPT4:-false}
      - DISABLE_FAST_LINK=${DISABLE_FAST_LINK:-false}
      - ENABLE_MCP=${ENABLE_MCP:-false}
      - ENABLE_GOOGLE_FONTS=${ENABLE_GOOGLE_FONTS:-false}

      # AI 服务商配置
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - AZURE_URL=${AZURE_URL:-}
      - AZURE_API_KEY=${AZURE_API_KEY:-}
      - BAIDU_API_KEY=${BAIDU_API_KEY:-}
      - BAIDU_SECRET_KEY=${BAIDU_SECRET_KEY:-}
      - BYTEDANCE_API_KEY=${BYTEDANCE_API_KEY:-}
      - ALIBABA_API_KEY=${ALIBABA_API_KEY:-}
      - TENCENT_SECRET_KEY=${TENCENT_SECRET_KEY:-}
      - TENCENT_SECRET_ID=${TENCENT_SECRET_ID:-}
      - MOONSHOT_API_KEY=${MOONSHOT_API_KEY:-}
      - IFLYTEK_API_KEY=${IFLYTEK_API_KEY:-}
      - IFLYTEK_API_SECRET=${IFLYTEK_API_SECRET:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - XAI_API_KEY=${XAI_API_KEY:-}
      - CHATGLM_API_KEY=${CHATGLM_API_KEY:-}
      - SILICONFLOW_API_KEY=${SILICONFLOW_API_KEY:-}
      - AI302_API_KEY=${AI302_API_KEY:-}

      # 自定义 API 地址
      - BASE_URL=${BASE_URL:-}

      # 同步数据归属 ID（不是登录用户名，三个必须一致）
      - NEXTCHAT_DISABLE_AUTH=${NEXTCHAT_DISABLE_AUTH:-false}
      - NEXTCHAT_DEFAULT_USER_ID=${NEXTCHAT_DEFAULT_USER_ID:-user:admin}
      - DEFAULT_SYNC_USER_ID=${DEFAULT_SYNC_USER_ID:-user:admin}
      - NEXT_PUBLIC_DEFAULT_SYNC_USER_ID=${NEXT_PUBLIC_DEFAULT_SYNC_USER_ID:-user:admin}

      # 数据库配置 - 直连远程 PostgreSQL
      # 显式覆盖镜像内 .env.production 的 localhost DATABASE_URL，避免运行时误连容器本地数据库
      - DATABASE_URL=${DATABASE_URL:-}
      # 这里不要再给出本地 postgres 容器默认值，避免漏配时误连到另一套数据库
      - PGHOST=${PGHOST:-}
      - PGPORT=${PGPORT:-5432}
      - PGDATABASE=${PGDATABASE:-nextchat}
      - PGUSER=${PGUSER:-}
      - PGPASSWORD=${PGPASSWORD:-}
      - PGSSL=${PGSSL:-false}
      - PGSSLMODE=${PGSSLMODE:-disable}
      - PGPOOL_MAX=${PGPOOL_MAX:-10}
      - PG_CONNECT_TIMEOUT_MS=${PG_CONNECT_TIMEOUT_MS:-10000}
      - PG_IDLE_TIMEOUT_MS=${PG_IDLE_TIMEOUT_MS:-30000}

      # GitHub 配置
      - GITHUB_BASE_URL=${GITHUB_BASE_URL:-https://github.com}
      - GITHUB_API_BASE_URL=${GITHUB_API_BASE_URL:-https://api.github.com}
      - GITHUB_RAW_BASE_URL=${GITHUB_RAW_BASE_URL:-https://raw.githubusercontent.com}

      # 默认模型
      - DEFAULT_MODEL=${DEFAULT_MODEL:-}

    volumes:
      - nextchat-data:/app/data

    healthcheck:
      test: ["CMD", "sh", "-c", "wget -q -O /dev/null http://127.0.0.1:3000/api/config || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  nextchat-data:
    driver: local
