# =============================================================================
# 宝塔面板配置说明
# =============================================================================
#
# 1. 在宝塔面板创建网站：
#    - 域名：填写你的域名或服务器 IP
#    - 根目录：/www/wwwroot/nextchat
#    - PHP 版本：纯静态
#
# 2. 配置 SSL 证书（推荐）：
#    - 网站设置 -> SSL -> Let's Encrypt -> 申请
#    - 开启强制 HTTPS
#
# 3. 修改 Nginx 配置：
#    - 网站设置 -> 配置文件
#    - 找到 location / { ... } 部分
#    - 替换为上面的 location / 配置
#    - 保存并重载配置
#
# 4. 验证配置：
#    - 浏览器访问 https://your-domain.com
#    - 应该看到 NextChat 登录页面
# =============================================================================
