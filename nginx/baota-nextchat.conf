# =============================================================================
# NextChat Nginx 反向代理配置 - 宝塔面板专用
# =============================================================================
# 使用方法：
# 1. 在宝塔面板创建网站（域名或 IP）
# 2. 进入网站设置 -> 配置文件
# 3. 找到 location / { ... } 部分，替换为以下配置
# =============================================================================

# ============================================================================
# 完整 server 块配置示例（HTTP + HTTPS）
# ============================================================================

# HTTP 重定向到 HTTPS（推荐）
server {
    listen 80;
    server_name your-domain.com www.your-domain.com;  # 修改为你的域名

    # 强制跳转 HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS 主配置
server {
    listen 443 ssl http2;
    server_name your-domain.com www.your-domain.com;  # 修改为你的域名

    # 网站目录（不需要实际文件，仅作宝塔配置使用）
    root /www/wwwroot/nextchat;

    # SSL 证书配置（宝塔会自动配置 Let's Encrypt 证书）
    ssl_certificate /www/server/panel/vhost/cert/your-domain.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/your-domain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 日志配置
    access_log /www/wwwlogs/nextchat_access.log;
    error_log /www/wwwlogs/nextchat_error.log;

    # =============================================================================
    # NextChat 反向代理配置 - 核心部分
    # =============================================================================
    location / {
        # 反向代理到 NextChat 容器
        proxy_pass http://127.0.0.1:3000;

        # HTTP 版本
        proxy_http_version 1.1;

        # WebSocket 支持（重要！实时对话需要）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 代理头部
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # 超时设置（长时间对话需要）
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # 缓冲设置（关闭以支持实时流式响应）
        proxy_buffering off;
        proxy_request_buffering off;

        # 禁用缓存
        proxy_cache_bypass $http_upgrade;
        add_header Cache-Control 'no-cache, no-store, must-revalidate';
    }

    # =============================================================================
    # 健康检查端点（可选）
    # =============================================================================
    location /health {
        proxy_pass http://127.0.0.1:3000/api/config;
        proxy_http_version 1.1;
        access_log off;
    }

    # =============================================================================
    # 静态资源缓存（可选）
    # =============================================================================
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 静态资源缓存
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}

# ============================================================================
