# =============================================================================
# NextChat Nginx 反向代理配置 - 宝塔面板专用
# =============================================================================
# 使用方法：
# 1. 在宝塔面板 -> 网站 -> 添加站点
# 2. 站点设置 -> 配置文件 -> 将此内容粘贴到 location / 之前
# 3. 修改 server_name 和 proxy_pass 中的端口
# =============================================================================

# HTTP 重定向到 HTTPS（推荐）
server {
    listen 80;
    server_name your-domain.com;  # 修改为你的域名
    return 301 https://$server_name$request_uri;
}

# HTTPS 主配置
server {
    listen 443 ssl http2;
    server_name your-domain.com;  # 修改为你的域名

    # SSL 证书配置（宝塔面板会自动配置）
    ssl_certificate /www/server/panel/vhost/cert/your-domain.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/your-domain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 日志配置
    access_log /www/wwwlogs/nextchat_access.log;
    error_log /www/wwwlogs/nextchat_error.log;

    # 客户端上传限制
    client_max_body_size 100m;

    # 反向代理到 NextChat 容器
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket 支持（重要！用于实时对话）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 代理头部
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置（长时间对话需要）
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # 缓冲设置
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # 健康检查端点（可选）
    location /health {
        proxy_pass http://127.0.0.1:3000/api/config;
        proxy_http_version 1.1;
        access_log off;
    }
}

