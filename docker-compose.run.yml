# 仅由根目录 run 载入的本地开发覆盖，不用于生产。
services:
  nextchat-dev:
    build:
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        APK_MIRROR: ${ALPINE_MIRROR:-https://dl-cdn.alpinelinux.org/alpine}
      cache_from:
        - type=local,src=${BUILD_CACHE_DIR}/nextchat-dev
      cache_to:
        - type=local,dest=${BUILD_CACHE_DIR}/nextchat-dev,mode=max
    # 免登录开发服务只监听宿主回环地址。
    ports: !override
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      NEXTCHAT_LOCAL_BYPASS_USER: ccc
    depends_on:
      postgres-ssh-tunnel:
        condition: service_healthy
      codeinterpreter-local:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/api/config', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 10s
      timeout: 10s
      start_period: 60s
      retries: 12
  postgres-ssh-tunnel:
    build:
      args:
        APK_MIRROR: ${ALPINE_MIRROR:-https://dl-cdn.alpinelinux.org/alpine}
      cache_from:
        - type=local,src=${BUILD_CACHE_DIR}/postgres-ssh-tunnel
      cache_to:
        - type=local,dest=${BUILD_CACHE_DIR}/postgres-ssh-tunnel,mode=max
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5432"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12
  codeinterpreter-local:
    build:
      args:
        APT_MIRROR: ${APT_MIRROR:-https://deb.debian.org}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
      cache_from:
        - type=local,src=${BUILD_CACHE_DIR}/codeinterpreter-local
      cache_to:
        - type=local,dest=${BUILD_CACHE_DIR}/codeinterpreter-local,mode=max
    healthcheck:
      # 只检查 gunicorn 端口，不执行代码或写入沙箱。
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; socket.create_connection(('127.0.0.1', 5000), timeout=2).close()",
        ]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12
