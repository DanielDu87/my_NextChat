<svg height="32" width="32" viewBox="0 0 30 30" xmlns="http://www.w3.org/2000/svg">
  <title>TheDrummer</title>
  <!-- Background -->
  <rect x="1.5" y="1.5" width="27" height="27" rx="9" fill="#FFF5F5" stroke="#FEE2E2" stroke-width="1" />

  <!-- Drumsticks (Behind) -->
  <g stroke="#F87171" stroke-width="1.5" stroke-linecap="round">
    <!-- Stick 1 -->
    <line x1="6" y1="24" x2="24" y2="6" />
    <circle cx="24" cy="6" r="1" fill="#F87171" stroke="none" />
    <!-- Stick 2 -->
    <line x1="24" y1="24" x2="6" y2="6" />
    <circle cx="6" cy="6" r="1" fill="#F87171" stroke="none" />
  </g>

  <!-- Drum (Front) -->
  <g fill="#EF4444" stroke="#DC2626" stroke-width="1" stroke-linejoin="round">
    <!-- Drum Body -->
    <path d="M 8,13 A 7,2 0 0,0 22,13 L 22,20 A 7,2 0 0,1 8,20 Z" />
    <!-- Drum Top Rim / Head -->
    <ellipse cx="15" cy="13" rx="7" ry="2" fill="#FEF2F2" />
    <!-- Drum Bottom Rim -->
    <ellipse cx="15" cy="20" rx="7" ry="2" fill="none" stroke="#DC2626" />
    <!-- Vertical Tension Rods -->
    <path d="M 11,14.5 L 11,18.5 M 15,15 L 15,20 M 19,14.5 L 19,18.5" fill="none" stroke="#DC2626" stroke-width="0.8" />
  </g>
</svg>
