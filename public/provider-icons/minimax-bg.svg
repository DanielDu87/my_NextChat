<svg height="30" width="30" viewBox="0 0 30 30" xmlns="http://www.w3.org/2000/svg">
  <title>Minimax</title>
  <rect width="30" height="30" rx="6" fill="#E7F8FF" />
  <g transform="translate(3, 3)">
    <defs>
      <linearGradient id="minimax-fill" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FF6B35"></stop>
        <stop offset="50%" stop-color="#F97316"></stop>
        <stop offset="100%" stop-color="#FB923C"></stop>
      </linearGradient>
    </defs>
    <!-- 海螺形状 - 螺旋线条 -->
    <circle cx="12" cy="12" r="9" fill="none" stroke="url(#minimax-fill)" stroke-width="2" opacity="0.3"></circle>
    <circle cx="12" cy="12" r="6.5" fill="none" stroke="url(#minimax-fill)" stroke-width="2" opacity="0.5"></circle>
    <circle cx="12" cy="12" r="4" fill="none" stroke="url(#minimax-fill)" stroke-width="2" opacity="0.7"></circle>
    <circle cx="12" cy="12" r="1.5" fill="url(#minimax-fill)"></circle>
    <!-- 装饰点 -->
    <circle cx="18" cy="6" r="1.2" fill="#F97316"></circle>
    <circle cx="6" cy="18" r="1" fill="#F97316" opacity="0.6"></circle>
  </g>
</svg>
