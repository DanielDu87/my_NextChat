x-no-proxy-env: &no-proxy-env
  HTTP_PROXY: ""
  HTTPS_PROXY: ""
  ALL_PROXY: ""
  http_proxy: ""
  https_proxy: ""
  all_proxy: ""
  npm_config_proxy: ""
  npm_config_https_proxy: ""
  npm_config_http_proxy: ""
  npm_config_all_proxy: ""
  npm_config_noproxy: "localhost,127.0.0.1,::1,0.0.0.0,host.docker.internal,postgres-ssh-tunnel,chatgpt-next-web,chatgpt-next-web-dev"
  YARN_HTTP_PROXY: ""
  YARN_HTTPS_PROXY: ""
  YARN_PROXY: ""
  NO_PROXY: "localhost,127.0.0.1,::1,0.0.0.0,host.docker.internal,postgres-ssh-tunnel,chatgpt-next-web,chatgpt-next-web-dev"
  no_proxy: "localhost,127.0.0.1,::1,0.0.0.0,host.docker.internal,postgres-ssh-tunnel,chatgpt-next-web,chatgpt-next-web-dev"

services:
  postgres-ssh-tunnel:
    profiles: [ "ssh-tunnel" ]
    container_name: postgres-ssh-tunnel
    build:
      context: .
      dockerfile: docker/postgres-ssh-tunnel/Dockerfile
    restart: unless-stopped
    environment:
      <<: *no-proxy-env
      SSH_TUNNEL_HOST: ${SSH_TUNNEL_HOST}
      SSH_TUNNEL_PORT: ${SSH_TUNNEL_PORT:-222}
      SSH_TUNNEL_USER: ${SSH_TUNNEL_USER}
      SSH_TUNNEL_PASSWORD: ${SSH_TUNNEL_PASSWORD}
      SSH_TUNNEL_REMOTE_HOST: ${SSH_TUNNEL_REMOTE_HOST:-127.0.0.1}
      SSH_TUNNEL_REMOTE_PORT: ${SSH_TUNNEL_REMOTE_PORT:-5432}
      SSH_TUNNEL_LOCAL_PORT: ${SSH_TUNNEL_LOCAL_PORT:-5432}
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 ${SSH_TUNNEL_LOCAL_PORT:-5432}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  chatgpt-next-web:
    profiles: [ "no-proxy" ]
    container_name: chatgpt-next-web
    image: nextchat-local-prod
    build:
      context: .
      args:
        ALPINE_MIRROR: ${ALPINE_MIRROR:-}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com/}
        RT_CLIENT_TGZ_URL: ${RT_CLIENT_TGZ_URL:-file:vendor/rt-client-0.5.0.tgz}
    restart: unless-stopped
    ports:
      - 3000:3000
    environment:
      <<: *no-proxy-env
      HOSTNAME: 0.0.0.0
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      CODE: ${CODE}
      BASE_URL: ${BASE_URL}
      OPENAI_ORG_ID: ${OPENAI_ORG_ID}
      HIDE_USER_API_KEY: ${HIDE_USER_API_KEY}
      DISABLE_GPT4: ${DISABLE_GPT4}
      ENABLE_BALANCE_QUERY: ${ENABLE_BALANCE_QUERY}
      DISABLE_FAST_LINK: ${DISABLE_FAST_LINK}
      ENABLE_GOOGLE_FONTS: ${ENABLE_GOOGLE_FONTS:-false}
      ENABLE_SHAREGPT: ${ENABLE_SHAREGPT:-false}
      SHAREGPT_URL: ${SHAREGPT_URL:-}
      MCP_MARKET_URL: ${MCP_MARKET_URL:-}
      ENABLE_EDGE_TTS: ${ENABLE_EDGE_TTS:-false}
      EDGE_TTS_VOICES_URL: ${EDGE_TTS_VOICES_URL:-}
      EDGE_TTS_WSS_URL: ${EDGE_TTS_WSS_URL:-}
      OPENAI_SB: ${OPENAI_SB}
      WHITE_WEBDAV_ENDPOINTS: ${WHITE_WEBDAV_ENDPOINTS}
      DATABASE_URL: ${DATABASE_URL:-}
      PGHOST: ${PGHOST:-}
      PGPORT: ${PGPORT:-5432}
      PGDATABASE: ${PGDATABASE}
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      PGSSL: ${PGSSL}
      PGPOOL_MAX: ${PGPOOL_MAX}
      PG_CONNECT_TIMEOUT_MS: ${PG_CONNECT_TIMEOUT_MS}
      PG_IDLE_TIMEOUT_MS: ${PG_IDLE_TIMEOUT_MS}
      WEBDAV_BASE_URL: ${WEBDAV_BASE_URL:-}
      WEBDAV_USERNAME: ${WEBDAV_USERNAME:-}
      WEBDAV_PASSWORD: ${WEBDAV_PASSWORD:-}

  chatgpt-next-web-dev:
    profiles: [ "dev" ]
    container_name: chatgpt-next-web-dev
    image: nextchat-local-dev
    build:
      context: .
      target: deps
      args:
        ALPINE_MIRROR: ${ALPINE_MIRROR:-}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com/}
        RT_CLIENT_TGZ_URL: ${RT_CLIENT_TGZ_URL:-file:vendor/rt-client-0.5.0.tgz}
    restart: unless-stopped
    working_dir: /app
    command: sh /app/scripts/dev-bootstrap.sh
    ports:
      - 3000:3000
    environment:
      <<: *no-proxy-env
      HOSTNAME: 0.0.0.0
      ENABLE_MASK_WATCH: "1"
      NODE_OPTIONS: --max-old-space-size=1536
      NEXT_DISABLE_ESLINT: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: ${WATCHPACK_POLLING:-false}
      WATCHPACK_POLLING_INTERVAL: ${WATCHPACK_POLLING_INTERVAL:-1000}
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-false}
      CHOKIDAR_INTERVAL: ${CHOKIDAR_INTERVAL:-1000}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      CODE: ${CODE}
      BASE_URL: ${BASE_URL}
      OPENAI_ORG_ID: ${OPENAI_ORG_ID}
      HIDE_USER_API_KEY: ${HIDE_USER_API_KEY}
      DISABLE_GPT4: ${DISABLE_GPT4}
      ENABLE_BALANCE_QUERY: ${ENABLE_BALANCE_QUERY}
      DISABLE_FAST_LINK: ${DISABLE_FAST_LINK}
      ENABLE_GOOGLE_FONTS: ${ENABLE_GOOGLE_FONTS:-false}
      ENABLE_SHAREGPT: ${ENABLE_SHAREGPT:-false}
      SHAREGPT_URL: ${SHAREGPT_URL:-}
      MCP_MARKET_URL: ${MCP_MARKET_URL:-}
      ENABLE_EDGE_TTS: ${ENABLE_EDGE_TTS:-false}
      EDGE_TTS_VOICES_URL: ${EDGE_TTS_VOICES_URL:-}
      EDGE_TTS_WSS_URL: ${EDGE_TTS_WSS_URL:-}
      OPENAI_SB: ${OPENAI_SB}
      WHITE_WEBDAV_ENDPOINTS: ${WHITE_WEBDAV_ENDPOINTS}
      DATABASE_URL: ${DATABASE_URL:-}
      PGHOST: ${PGHOST:-}
      PGPORT: ${PGPORT:-5432}
      PGDATABASE: ${PGDATABASE}
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      PGSSL: ${PGSSL}
      PGPOOL_MAX: ${PGPOOL_MAX}
      PG_CONNECT_TIMEOUT_MS: ${PG_CONNECT_TIMEOUT_MS}
      PG_IDLE_TIMEOUT_MS: ${PG_IDLE_TIMEOUT_MS}
      WEBDAV_BASE_URL: ${WEBDAV_BASE_URL:-}
      WEBDAV_USERNAME: ${WEBDAV_USERNAME:-}
      WEBDAV_PASSWORD: ${WEBDAV_PASSWORD:-}
    volumes:
      - .:/app:delegated
      - nextchat_node_modules:/app/node_modules
      - nextchat_next_cache:/app/.next

volumes:
  nextchat_node_modules:
  nextchat_next_cache:
