version: "3.9"
services:
  chatgpt-next-web:
    profiles: [ "no-proxy" ]
    container_name: chatgpt-next-web
    image: nextchat-local
    build:
      context: .
    ports:
      - 3000:3000
    environment:
      - OPENAI_API_KEY=$OPENAI_API_KEY
      - GOOGLE_API_KEY=$GOOGLE_API_KEY
      - CODE=$CODE
      - BASE_URL=$BASE_URL
      - OPENAI_ORG_ID=$OPENAI_ORG_ID
      - HIDE_USER_API_KEY=$HIDE_USER_API_KEY
      - DISABLE_GPT4=$DISABLE_GPT4
      - ENABLE_BALANCE_QUERY=$ENABLE_BALANCE_QUERY
      - DISABLE_FAST_LINK=$DISABLE_FAST_LINK
      - OPENAI_SB=$OPENAI_SB
      - WHITE_WEBDAV_ENDPOINTS=$WHITE_WEBDAV_ENDPOINTS
      - DATABASE_URL=$DATABASE_URL
      - PGHOST=$PGHOST
      - PGPORT=$PGPORT
      - PGDATABASE=$PGDATABASE
      - PGUSER=$PGUSER
      - PGPASSWORD=$PGPASSWORD
      - PGSSL=$PGSSL
      - PGPOOL_MAX=$PGPOOL_MAX
      - PG_CONNECT_TIMEOUT_MS=$PG_CONNECT_TIMEOUT_MS
      - PG_IDLE_TIMEOUT_MS=$PG_IDLE_TIMEOUT_MS
      - WEBDAV_BASE_URL=$WEBDAV_BASE_URL
      - WEBDAV_USERNAME=$WEBDAV_USERNAME
      - WEBDAV_PASSWORD=$WEBDAV_PASSWORD

  chatgpt-next-web-dev:
    profiles: [ "dev" ]
    container_name: chatgpt-next-web-dev
    image: nextchat-local
    build:
      context: .
      target: deps
    working_dir: /app
    command: sh -c "yarn install && (yarn mask:watch &) && yarn next dev -H 0.0.0.0"
    ports:
      - 3000:3000
    environment:
      - HOSTNAME=0.0.0.0
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - OPENAI_API_KEY=$OPENAI_API_KEY
      - GOOGLE_API_KEY=$GOOGLE_API_KEY
      - CODE=$CODE
      - BASE_URL=$BASE_URL
      - OPENAI_ORG_ID=$OPENAI_ORG_ID
      - HIDE_USER_API_KEY=$HIDE_USER_API_KEY
      - DISABLE_GPT4=$DISABLE_GPT4
      - ENABLE_BALANCE_QUERY=$ENABLE_BALANCE_QUERY
      - DISABLE_FAST_LINK=$DISABLE_FAST_LINK
      - OPENAI_SB=$OPENAI_SB
      - WHITE_WEBDAV_ENDPOINTS=$WHITE_WEBDAV_ENDPOINTS
      - DATABASE_URL=$DATABASE_URL
      - PGHOST=$PGHOST
      - PGPORT=$PGPORT
      - PGDATABASE=$PGDATABASE
      - PGUSER=$PGUSER
      - PGPASSWORD=$PGPASSWORD
      - PGSSL=$PGSSL
      - PGPOOL_MAX=$PGPOOL_MAX
      - PG_CONNECT_TIMEOUT_MS=$PG_CONNECT_TIMEOUT_MS
      - PG_IDLE_TIMEOUT_MS=$PG_IDLE_TIMEOUT_MS
      - WEBDAV_BASE_URL=$WEBDAV_BASE_URL
      - WEBDAV_USERNAME=$WEBDAV_USERNAME
      - WEBDAV_PASSWORD=$WEBDAV_PASSWORD
    volumes:
      - .:/app
      - nextchat_node_modules:/app/node_modules
      - nextchat_next_cache:/app/.next

  chatgpt-next-web-proxy:
    profiles: [ "proxy" ]
    container_name: chatgpt-next-web-proxy
    image: nextchat-local
    build:
      context: .
    ports:
      - 3000:3000
    environment:
      - OPENAI_API_KEY=$OPENAI_API_KEY
      - GOOGLE_API_KEY=$GOOGLE_API_KEY
      - CODE=$CODE
      - PROXY_URL=$PROXY_URL
      - BASE_URL=$BASE_URL
      - OPENAI_ORG_ID=$OPENAI_ORG_ID
      - HIDE_USER_API_KEY=$HIDE_USER_API_KEY
      - DISABLE_GPT4=$DISABLE_GPT4
      - ENABLE_BALANCE_QUERY=$ENABLE_BALANCE_QUERY
      - DISABLE_FAST_LINK=$DISABLE_FAST_LINK
      - OPENAI_SB=$OPENAI_SB
      - WHITE_WEBDAV_ENDPOINTS=$WHITE_WEBDAV_ENDPOINTS
      - DATABASE_URL=$DATABASE_URL
      - PGHOST=$PGHOST
      - PGPORT=$PGPORT
      - PGDATABASE=$PGDATABASE
      - PGUSER=$PGUSER
      - PGPASSWORD=$PGPASSWORD
      - PGSSL=$PGSSL
      - PGPOOL_MAX=$PGPOOL_MAX
      - PG_CONNECT_TIMEOUT_MS=$PG_CONNECT_TIMEOUT_MS
      - PG_IDLE_TIMEOUT_MS=$PG_IDLE_TIMEOUT_MS
      - WEBDAV_BASE_URL=$WEBDAV_BASE_URL
      - WEBDAV_USERNAME=$WEBDAV_USERNAME
      - WEBDAV_PASSWORD=$WEBDAV_PASSWORD

volumes:
  nextchat_node_modules:
  nextchat_next_cache:
