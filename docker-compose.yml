# =============================================================================
# NextChat Docker Compose 配置
# =============================================================================
# 本地开发（热加载）: ./scripts/docker-compose-safe.sh --env-file .env.docker --profile dev up -d
# 生产部署（直连数据库）: ./scripts/docker-compose-safe.sh --env-file .env.docker --profile no-proxy up -d
# 生产部署（SSH 隧道）: ./scripts/docker-compose-safe.sh --env-file .env.docker --profile no-proxy --profile ssh-tunnel up -d
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 数据库服务
  # 仅在需要本地数据库时显式启用 `--profile local-db`
  # ---------------------------------------------------------------------------
  postgres:
    profiles: [local-db]
    image: postgres:16-alpine
    container_name: nextchat-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${PGDATABASE:-nextchat}
      - POSTGRES_USER=${PGUSER:-postgres}
      - POSTGRES_PASSWORD=${PGPASSWORD:-postgres}
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      - nextchat-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-postgres} -d ${PGDATABASE:-nextchat}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # 本地开发环境 - 热加载模式
  # 代码修改后自动刷新，无需重启容器
  # ---------------------------------------------------------------------------
  nextchat-dev:
    profiles: [dev]
    build:
      context: .
      target: dev
      args:
        - APK_MIRROR=${ALPINE_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn/alpine}
        - NPM_REGISTRY=${NPM_REGISTRY:-https://registry.npmmirror.com}
        - NODE_OPTIONS=${NODE_OPTIONS:---max-old-space-size=4096}
        - ENABLE_GOOGLE_FONTS=${ENABLE_GOOGLE_FONTS:-false}
        - GITHUB_BASE_URL=${GITHUB_BASE_URL:-https://github.com}
        - GITHUB_API_BASE_URL=${GITHUB_API_BASE_URL:-https://api.github.com}
        - GITHUB_RAW_BASE_URL=${GITHUB_RAW_BASE_URL:-https://raw.githubusercontent.com}
        - ENABLE_SHAREGPT=${ENABLE_SHAREGPT:-false}
        - SHAREGPT_URL=${SHAREGPT_URL:-}
        - MCP_MARKET_URL=${MCP_MARKET_URL:-}
        - ENABLE_EDGE_TTS=${ENABLE_EDGE_TTS:-false}
        - EDGE_TTS_VOICES_URL=${EDGE_TTS_VOICES_URL:-}
        - EDGE_TTS_WSS_URL=${EDGE_TTS_WSS_URL:-}
        - DEFAULT_INPUT_TEMPLATE=${DEFAULT_INPUT_TEMPLATE:-}
        - BUILD_COMMIT_DATE=${BUILD_COMMIT_DATE:-unknown}
        - BUILD_COMMIT_HASH=${BUILD_COMMIT_HASH:-unknown}
        - NEXT_PUBLIC_DEFAULT_SYNC_USER_ID=${NEXT_PUBLIC_DEFAULT_SYNC_USER_ID:-user:admin}
    container_name: nextchat-dev
    ports:
      - "${PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,::1}
      - NODE_ENV=development
      - HOSTNAME=0.0.0.0
      - CHOKIDAR_USEPOLLING=${CHOKIDAR_USEPOLLING:-false}
      - CHOKIDAR_INTERVAL=${CHOKIDAR_INTERVAL:-1000}
      - WATCHPACK_POLLING=${WATCHPACK_POLLING:-false}
      - WATCHPACK_POLLING_INTERVAL=${WATCHPACK_POLLING_INTERVAL:-1000}
      - NEXT_TELEMETRY_DISABLED=1
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - CODE=${CODE}
      - BASE_URL=${BASE_URL}
      - HIDE_USER_API_KEY=${HIDE_USER_API_KEY:-true}
      - DISABLE_GPT4=${DISABLE_GPT4:-false}
      - ENABLE_BALANCE_QUERY=${ENABLE_BALANCE_QUERY:-false}
      - DISABLE_FAST_LINK=${DISABLE_FAST_LINK:-false}
      - ENABLE_MCP=${ENABLE_MCP:-false}
      - ENABLE_GOOGLE_FONTS=${ENABLE_GOOGLE_FONTS:-false}
      - GITHUB_BASE_URL=${GITHUB_BASE_URL:-https://github.com}
      - GITHUB_API_BASE_URL=${GITHUB_API_BASE_URL:-https://api.github.com}
      - GITHUB_RAW_BASE_URL=${GITHUB_RAW_BASE_URL:-https://raw.githubusercontent.com}
      - ENABLE_SHAREGPT=${ENABLE_SHAREGPT:-false}
      - SHAREGPT_URL=${SHAREGPT_URL:-}
      - MCP_MARKET_URL=${MCP_MARKET_URL:-}
      - ENABLE_EDGE_TTS=${ENABLE_EDGE_TTS:-false}
      - EDGE_TTS_VOICES_URL=${EDGE_TTS_VOICES_URL:-}
      - EDGE_TTS_WSS_URL=${EDGE_TTS_WSS_URL:-}
      - DEFAULT_INPUT_TEMPLATE=${DEFAULT_INPUT_TEMPLATE:-}
      - NEXTCHAT_DISABLE_AUTH=${NEXTCHAT_DISABLE_AUTH:-false}
      - NEXTCHAT_DEFAULT_USER_ID=${NEXTCHAT_DEFAULT_USER_ID:-user:admin}
      - DEFAULT_SYNC_USER_ID=${DEFAULT_SYNC_USER_ID:-user:admin}
      - NEXT_PUBLIC_DEFAULT_SYNC_USER_ID=${NEXT_PUBLIC_DEFAULT_SYNC_USER_ID:-user:admin}
      - DATABASE_URL=${DATABASE_URL}
      - PGHOST=${PGHOST}
      - PGPORT=${PGPORT}
      - PGDATABASE=${PGDATABASE}
      - PGUSER=${PGUSER}
      - PGPASSWORD=${PGPASSWORD}
      - PGSSL=${PGSSL}
      - PGSSLMODE=${PGSSLMODE:-}
      - PGPOOL_MAX=${PGPOOL_MAX}
      - PG_CONNECT_TIMEOUT_MS=${PG_CONNECT_TIMEOUT_MS}
      - PG_IDLE_TIMEOUT_MS=${PG_IDLE_TIMEOUT_MS}
    volumes:
      # 挂载源代码实现热加载
      - .:/app
      # 独立卷避免宿主机 node_modules 干扰
      - nextchat-node_modules:/app/node_modules
      - nextchat-next_cache:/app/.next
    develop:
      watch:
        - action: sync
          path: ./app
          target: /app/app
          ignore:
            - node_modules/
        - action: sync+restart
          path: ./package.json
          target: /app/package.json
    command:
      - sh
      - -lc
      - yarn install --frozen-lockfile --network-timeout 600000 && yarn dev --hostname 0.0.0.0

  # ---------------------------------------------------------------------------
  # 生产环境 - 服务器部署（使用本地构建）
  # ---------------------------------------------------------------------------
  nextchat-production:
    profiles: [production, no-proxy]
    build:
      context: .
      target: runner
      args:
        - APK_MIRROR=${ALPINE_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn/alpine}
        - NPM_REGISTRY=${NPM_REGISTRY:-https://registry.npmmirror.com}
        - ENABLE_GOOGLE_FONTS=${ENABLE_GOOGLE_FONTS:-false}
        - GITHUB_BASE_URL=${GITHUB_BASE_URL:-https://github.com}
        - GITHUB_API_BASE_URL=${GITHUB_API_BASE_URL:-https://api.github.com}
        - GITHUB_RAW_BASE_URL=${GITHUB_RAW_BASE_URL:-https://raw.githubusercontent.com}
        - ENABLE_SHAREGPT=${ENABLE_SHAREGPT:-false}
        - SHAREGPT_URL=${SHAREGPT_URL:-}
        - MCP_MARKET_URL=${MCP_MARKET_URL:-}
        - ENABLE_EDGE_TTS=${ENABLE_EDGE_TTS:-false}
        - EDGE_TTS_VOICES_URL=${EDGE_TTS_VOICES_URL:-}
        - EDGE_TTS_WSS_URL=${EDGE_TTS_WSS_URL:-}
        - DEFAULT_INPUT_TEMPLATE=${DEFAULT_INPUT_TEMPLATE:-}
        - BUILD_COMMIT_DATE=${BUILD_COMMIT_DATE:-unknown}
        - BUILD_COMMIT_HASH=${BUILD_COMMIT_HASH:-unknown}
        - NEXT_PUBLIC_DEFAULT_SYNC_USER_ID=${NEXT_PUBLIC_DEFAULT_SYNC_USER_ID:-user:admin}
    image: nextchat:${IMAGE_TAG:-latest}
    container_name: nextchat
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=production
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - CODE=${CODE}
      - BASE_URL=${BASE_URL}
      - HIDE_USER_API_KEY=${HIDE_USER_API_KEY:-true}
      - DISABLE_GPT4=${DISABLE_GPT4:-false}
      - ENABLE_BALANCE_QUERY=${ENABLE_BALANCE_QUERY:-false}
      - DISABLE_FAST_LINK=${DISABLE_FAST_LINK:-false}
      - ENABLE_MCP=${ENABLE_MCP:-false}
      - ENABLE_GOOGLE_FONTS=${ENABLE_GOOGLE_FONTS:-false}
      - GITHUB_BASE_URL=${GITHUB_BASE_URL:-https://github.com}
      - GITHUB_API_BASE_URL=${GITHUB_API_BASE_URL:-https://api.github.com}
      - GITHUB_RAW_BASE_URL=${GITHUB_RAW_BASE_URL:-https://raw.githubusercontent.com}
      - ENABLE_SHAREGPT=${ENABLE_SHAREGPT:-false}
      - SHAREGPT_URL=${SHAREGPT_URL:-}
      - MCP_MARKET_URL=${MCP_MARKET_URL:-}
      - ENABLE_EDGE_TTS=${ENABLE_EDGE_TTS:-false}
      - EDGE_TTS_VOICES_URL=${EDGE_TTS_VOICES_URL:-}
      - EDGE_TTS_WSS_URL=${EDGE_TTS_WSS_URL:-}
      - DEFAULT_INPUT_TEMPLATE=${DEFAULT_INPUT_TEMPLATE:-}
      - NEXTCHAT_DISABLE_AUTH=${NEXTCHAT_DISABLE_AUTH:-false}
      - NEXTCHAT_DEFAULT_USER_ID=${NEXTCHAT_DEFAULT_USER_ID:-user:admin}
      - DEFAULT_SYNC_USER_ID=${DEFAULT_SYNC_USER_ID:-user:admin}
      - NEXT_PUBLIC_DEFAULT_SYNC_USER_ID=${NEXT_PUBLIC_DEFAULT_SYNC_USER_ID:-user:admin}
      - PROXY_URL=${PROXY_URL:-}
      - DATABASE_URL=${DATABASE_URL}
      - PGHOST=${PGHOST}
      - PGPORT=${PGPORT}
      - PGDATABASE=${PGDATABASE}
      - PGUSER=${PGUSER}
      - PGPASSWORD=${PGPASSWORD}
      - PGSSL=${PGSSL}
      - PGSSLMODE=${PGSSLMODE:-}
      - PGPOOL_MAX=${PGPOOL_MAX}
      - PG_CONNECT_TIMEOUT_MS=${PG_CONNECT_TIMEOUT_MS}
      - PG_IDLE_TIMEOUT_MS=${PG_IDLE_TIMEOUT_MS}
    volumes:
      # 持久化数据存储
      - nextchat-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/config', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # PostgreSQL SSH 隧道
  # 仅在必须通过跳板机访问数据库时启用 `--profile ssh-tunnel`
  # ---------------------------------------------------------------------------
  postgres-ssh-tunnel:
    profiles: [ssh-tunnel]
    build:
      context: .
      dockerfile: docker/postgres-ssh-tunnel/Dockerfile
    container_name: nextchat-postgres-ssh-tunnel
    restart: unless-stopped
    environment:
      - SSH_TUNNEL_HOST=${SSH_TUNNEL_HOST}
      - SSH_TUNNEL_PORT=${SSH_TUNNEL_PORT:-222}
      - SSH_TUNNEL_USER=${SSH_TUNNEL_USER}
      - SSH_TUNNEL_PASSWORD=${SSH_TUNNEL_PASSWORD}
      - SSH_TUNNEL_REMOTE_HOST=${SSH_TUNNEL_REMOTE_HOST:-127.0.0.1}
      - SSH_TUNNEL_REMOTE_PORT=${SSH_TUNNEL_REMOTE_PORT:-5432}
      - SSH_TUNNEL_LOCAL_PORT=${SSH_TUNNEL_LOCAL_PORT:-5432}

  # ---------------------------------------------------------------------------
  # 生产环境 - 使用官方镜像（快速部署）
  # ---------------------------------------------------------------------------
  nextchat-official:
    profiles: [official]
    image: yidadaa/chatgpt-next-web:latest
    container_name: nextchat
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - CODE=${CODE}
      - BASE_URL=${BASE_URL}
      - HIDE_USER_API_KEY=${HIDE_USER_API_KEY:-true}
      - DISABLE_GPT4=${DISABLE_GPT4:-false}
      - ENABLE_BALANCE_QUERY=${ENABLE_BALANCE_QUERY:-false}
      - DISABLE_FAST_LINK=${DISABLE_FAST_LINK:-false}
      - ENABLE_MCP=${ENABLE_MCP:-false}
      - NEXTCHAT_DISABLE_AUTH=${NEXTCHAT_DISABLE_AUTH:-false}
      - NEXTCHAT_DEFAULT_USER_ID=${NEXTCHAT_DEFAULT_USER_ID:-user:admin}
      - DEFAULT_SYNC_USER_ID=${DEFAULT_SYNC_USER_ID:-user:admin}
      - NEXT_PUBLIC_DEFAULT_SYNC_USER_ID=${NEXT_PUBLIC_DEFAULT_SYNC_USER_ID:-user:admin}
      - DATABASE_URL=${DATABASE_URL}
      - PGHOST=${PGHOST}
      - PGPORT=${PGPORT}
      - PGDATABASE=${PGDATABASE}
      - PGUSER=${PGUSER}
      - PGPASSWORD=${PGPASSWORD}
      - PGSSL=${PGSSL}
      - PGSSLMODE=${PGSSLMODE:-}
      - PGPOOL_MAX=${PGPOOL_MAX}
      - PG_CONNECT_TIMEOUT_MS=${PG_CONNECT_TIMEOUT_MS}
      - PG_IDLE_TIMEOUT_MS=${PG_IDLE_TIMEOUT_MS}
    volumes:
      - nextchat-data:/app/data

volumes:
  nextchat-node_modules:
  nextchat-next_cache:
  nextchat-data:
  nextchat-postgres-data:
