services:
  postgres-ssh-tunnel:
    container_name: postgres-ssh-tunnel
    build:
      context: .
      dockerfile: docker/postgres-ssh-tunnel/Dockerfile
    restart: unless-stopped
    environment:
      - SSH_TUNNEL_HOST=${SSH_TUNNEL_HOST}
      - SSH_TUNNEL_PORT=${SSH_TUNNEL_PORT:-222}
      - SSH_TUNNEL_USER=${SSH_TUNNEL_USER}
      - SSH_TUNNEL_PASSWORD=${SSH_TUNNEL_PASSWORD}
      - SSH_TUNNEL_REMOTE_HOST=${SSH_TUNNEL_REMOTE_HOST:-127.0.0.1}
      - SSH_TUNNEL_REMOTE_PORT=${SSH_TUNNEL_REMOTE_PORT:-5432}
      - SSH_TUNNEL_LOCAL_PORT=${SSH_TUNNEL_LOCAL_PORT:-5432}
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 ${SSH_TUNNEL_LOCAL_PORT:-5432}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  chatgpt-next-web:
    profiles: [ "no-proxy" ]
    container_name: chatgpt-next-web
    image: nextchat-local
    build:
      context: .
    depends_on:
      postgres-ssh-tunnel:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - 3000:3000
    environment:
      - OPENAI_API_KEY=$OPENAI_API_KEY
      - GOOGLE_API_KEY=$GOOGLE_API_KEY
      - CODE=$CODE
      - BASE_URL=$BASE_URL
      - OPENAI_ORG_ID=$OPENAI_ORG_ID
      - HIDE_USER_API_KEY=$HIDE_USER_API_KEY
      - DISABLE_GPT4=$DISABLE_GPT4
      - ENABLE_BALANCE_QUERY=$ENABLE_BALANCE_QUERY
      - DISABLE_FAST_LINK=$DISABLE_FAST_LINK
      - OPENAI_SB=$OPENAI_SB
      - WHITE_WEBDAV_ENDPOINTS=$WHITE_WEBDAV_ENDPOINTS
      - DATABASE_URL=${DATABASE_URL:-}
      - PGHOST=${PGHOST:-postgres-ssh-tunnel}
      - PGPORT=${PGPORT:-5432}
      - PGDATABASE=$PGDATABASE
      - PGUSER=$PGUSER
      - PGPASSWORD=$PGPASSWORD
      - PGSSL=$PGSSL
      - PGPOOL_MAX=$PGPOOL_MAX
      - PG_CONNECT_TIMEOUT_MS=$PG_CONNECT_TIMEOUT_MS
      - PG_IDLE_TIMEOUT_MS=$PG_IDLE_TIMEOUT_MS
      - WEBDAV_BASE_URL=${WEBDAV_BASE_URL:-}
      - WEBDAV_USERNAME=${WEBDAV_USERNAME:-}
      - WEBDAV_PASSWORD=${WEBDAV_PASSWORD:-}

  chatgpt-next-web-dev:
    profiles: [ "dev" ]
    container_name: chatgpt-next-web-dev
    image: nextchat-local
    build:
      context: .
      target: deps
    depends_on:
      postgres-ssh-tunnel:
        condition: service_healthy
    restart: unless-stopped
    working_dir: /app
    command: sh /app/scripts/dev-bootstrap.sh
    ports:
      - 3000:3000
    environment:
      - HOSTNAME=0.0.0.0
      - ENABLE_MASK_WATCH=0
      - NODE_OPTIONS=--max-old-space-size=768
      - NEXT_DISABLE_ESLINT=1
      - NEXT_TELEMETRY_DISABLED=1
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - OPENAI_API_KEY=$OPENAI_API_KEY
      - GOOGLE_API_KEY=$GOOGLE_API_KEY
      - CODE=$CODE
      - BASE_URL=$BASE_URL
      - OPENAI_ORG_ID=$OPENAI_ORG_ID
      - HIDE_USER_API_KEY=$HIDE_USER_API_KEY
      - DISABLE_GPT4=$DISABLE_GPT4
      - ENABLE_BALANCE_QUERY=$ENABLE_BALANCE_QUERY
      - DISABLE_FAST_LINK=$DISABLE_FAST_LINK
      - OPENAI_SB=$OPENAI_SB
      - WHITE_WEBDAV_ENDPOINTS=$WHITE_WEBDAV_ENDPOINTS
      - DATABASE_URL=${DATABASE_URL:-}
      - PGHOST=${PGHOST:-postgres-ssh-tunnel}
      - PGPORT=${PGPORT:-5432}
      - PGDATABASE=$PGDATABASE
      - PGUSER=$PGUSER
      - PGPASSWORD=$PGPASSWORD
      - PGSSL=$PGSSL
      - PGPOOL_MAX=$PGPOOL_MAX
      - PG_CONNECT_TIMEOUT_MS=$PG_CONNECT_TIMEOUT_MS
      - PG_IDLE_TIMEOUT_MS=$PG_IDLE_TIMEOUT_MS
      - WEBDAV_BASE_URL=${WEBDAV_BASE_URL:-}
      - WEBDAV_USERNAME=${WEBDAV_USERNAME:-}
      - WEBDAV_PASSWORD=${WEBDAV_PASSWORD:-}
    volumes:
      - .:/app:delegated
      - nextchat_node_modules:/app/node_modules
      - nextchat_next_cache:/app/.next

  chatgpt-next-web-proxy:
    profiles: [ "proxy" ]
    container_name: chatgpt-next-web-proxy
    image: nextchat-local
    build:
      context: .
    depends_on:
      postgres-ssh-tunnel:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - 3000:3000
    environment:
      - OPENAI_API_KEY=$OPENAI_API_KEY
      - GOOGLE_API_KEY=$GOOGLE_API_KEY
      - CODE=$CODE
      - PROXY_URL=$PROXY_URL
      - BASE_URL=$BASE_URL
      - OPENAI_ORG_ID=$OPENAI_ORG_ID
      - HIDE_USER_API_KEY=$HIDE_USER_API_KEY
      - DISABLE_GPT4=$DISABLE_GPT4
      - ENABLE_BALANCE_QUERY=$ENABLE_BALANCE_QUERY
      - DISABLE_FAST_LINK=$DISABLE_FAST_LINK
      - OPENAI_SB=$OPENAI_SB
      - WHITE_WEBDAV_ENDPOINTS=$WHITE_WEBDAV_ENDPOINTS
      - DATABASE_URL=${DATABASE_URL:-}
      - PGHOST=${PGHOST:-postgres-ssh-tunnel}
      - PGPORT=${PGPORT:-5432}
      - PGDATABASE=$PGDATABASE
      - PGUSER=$PGUSER
      - PGPASSWORD=$PGPASSWORD
      - PGSSL=$PGSSL
      - PGPOOL_MAX=$PGPOOL_MAX
      - PG_CONNECT_TIMEOUT_MS=$PG_CONNECT_TIMEOUT_MS
      - PG_IDLE_TIMEOUT_MS=$PG_IDLE_TIMEOUT_MS
      - WEBDAV_BASE_URL=${WEBDAV_BASE_URL:-}
      - WEBDAV_USERNAME=${WEBDAV_USERNAME:-}
      - WEBDAV_PASSWORD=${WEBDAV_PASSWORD:-}

volumes:
  nextchat_node_modules:
  nextchat_next_cache:
