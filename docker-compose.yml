# =============================================================================
# NextChat Docker Compose 配置
# =============================================================================
# 本地开发（热加载）: docker-compose up
# 服务器部署: docker-compose --profile production up -d
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 数据库服务
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: nextchat-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${PGDATABASE:-nextchat}
      - POSTGRES_USER=${PGUSER:-postgres}
      - POSTGRES_PASSWORD=${PGPASSWORD:-postgres}
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      - nextchat-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-postgres} -d ${PGDATABASE:-nextchat}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # 本地开发环境 - 热加载模式
  # 代码修改后自动刷新，无需重启容器
  # ---------------------------------------------------------------------------
  nextchat-dev:
    build:
      context: .
      target: dev
      args:
        - APK_MIRROR=https://mirrors.tuna.tsinghua.edu.cn/alpine
        - NPM_REGISTRY=https://registry.npmmirror.com
        - NODE_OPTIONS=--max-old-space-size=4096
    container_name: nextchat-dev
    ports:
      - "${PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - NODE_ENV=development
      - HOSTNAME=0.0.0.0
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - NEXT_TELEMETRY_DISABLED=1
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - CODE=${CODE}
      - BASE_URL=${BASE_URL}
      - HIDE_USER_API_KEY=${HIDE_USER_API_KEY:-true}
      - DISABLE_GPT4=${DISABLE_GPT4:-false}
      - ENABLE_BALANCE_QUERY=${ENABLE_BALANCE_QUERY:-false}
      - NEXTCHAT_DEFAULT_USER_ID=${NEXTCHAT_DEFAULT_USER_ID}
      - DEFAULT_SYNC_USER_ID=${DEFAULT_SYNC_USER_ID}
      - DATABASE_URL=${DATABASE_URL}
      - PGHOST=${PGHOST}
      - PGPORT=${PGPORT}
      - PGDATABASE=${PGDATABASE}
      - PGUSER=${PGUSER}
      - PGPASSWORD=${PGPASSWORD}
      - PGSSL=${PGSSL}
      - PGSSLMODE=${PGSSLMODE}
      - PGPOOL_MAX=${PGPOOL_MAX}
      - PG_CONNECT_TIMEOUT_MS=${PG_CONNECT_TIMEOUT_MS}
      - PG_IDLE_TIMEOUT_MS=${PG_IDLE_TIMEOUT_MS}
    volumes:
      # 挂载源代码实现热加载
      - .:/app
      # 独立卷避免宿主机 node_modules 干扰
      - nextchat-node_modules:/app/node_modules
      - nextchat-next_cache:/app/.next
    develop:
      watch:
        - action: sync
          path: ./app
          target: /app/app
          ignore:
            - node_modules/
        - action: sync+restart
          path: ./package.json
          target: /app/package.json
    command:
      - sh
      - -lc
      - npm install && yarn dev --hostname 0.0.0.0

  # ---------------------------------------------------------------------------
  # 生产环境 - 服务器部署（使用本地构建）
  # ---------------------------------------------------------------------------
  nextchat-production:
    profiles: [production]
    build:
      context: .
      target: runner
      args:
        - APK_MIRROR=https://mirrors.tuna.tsinghua.edu.cn/alpine
        - NPM_REGISTRY=https://registry.npmmirror.com
    image: nextchat:${IMAGE_TAG:-latest}
    container_name: nextchat
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=production
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - CODE=${CODE}
      - BASE_URL=${BASE_URL}
      - HIDE_USER_API_KEY=${HIDE_USER_API_KEY:-true}
      - DISABLE_GPT4=${DISABLE_GPT4:-false}
      - ENABLE_BALANCE_QUERY=${ENABLE_BALANCE_QUERY:-false}
      - NEXTCHAT_DEFAULT_USER_ID=${NEXTCHAT_DEFAULT_USER_ID}
      - DEFAULT_SYNC_USER_ID=${DEFAULT_SYNC_USER_ID}
      - PROXY_URL=${PROXY_URL:-}
      - DATABASE_URL=${DATABASE_URL}
      - PGHOST=${PGHOST}
      - PGPORT=${PGPORT}
      - PGDATABASE=${PGDATABASE}
      - PGUSER=${PGUSER}
      - PGPASSWORD=${PGPASSWORD}
      - PGSSL=${PGSSL}
      - PGSSLMODE=${PGSSLMODE}
      - PGPOOL_MAX=${PGPOOL_MAX}
      - PG_CONNECT_TIMEOUT_MS=${PG_CONNECT_TIMEOUT_MS}
      - PG_IDLE_TIMEOUT_MS=${PG_IDLE_TIMEOUT_MS}
    volumes:
      # 持久化数据存储
      - nextchat-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/config', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # 生产环境 - 使用官方镜像（快速部署）
  # ---------------------------------------------------------------------------
  nextchat-official:
    profiles: [official]
    image: yidadaa/chatgpt-next-web:latest
    container_name: nextchat
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - CODE=${CODE}
      - BASE_URL=${BASE_URL}
      - HIDE_USER_API_KEY=${HIDE_USER_API_KEY:-true}
      - NEXTCHAT_DEFAULT_USER_ID=${NEXTCHAT_DEFAULT_USER_ID}
      - DEFAULT_SYNC_USER_ID=${DEFAULT_SYNC_USER_ID}
      - DATABASE_URL=${DATABASE_URL}
      - PGHOST=${PGHOST}
      - PGPORT=${PGPORT}
      - PGDATABASE=${PGDATABASE}
      - PGUSER=${PGUSER}
      - PGPASSWORD=${PGPASSWORD}
      - PGSSL=${PGSSL}
      - PGSSLMODE=${PGSSLMODE}
      - PGPOOL_MAX=${PGPOOL_MAX}
      - PG_CONNECT_TIMEOUT_MS=${PG_CONNECT_TIMEOUT_MS}
      - PG_IDLE_TIMEOUT_MS=${PG_IDLE_TIMEOUT_MS}
    volumes:
      - nextchat-data:/app/data

volumes:
  nextchat-node_modules:
  nextchat-next_cache:
  nextchat-data:
  nextchat-postgres-data:
